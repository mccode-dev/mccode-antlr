[project]
site_name = "mccode-antlr"
site_description = "ANTLR4-based McStas and McXtrace instrument compiler and Python API"
site_url = "https://mccode-dev.github.io/mccode-antlr/"
repo_url = "https://github.com/mccode-dev/mccode-antlr"
repo_name = "mccode-dev/mccode-antlr"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation & Quick Start" = "getting-started.md" },
    { "Core Concepts" = "core-concepts.md" },
  ] },
  { "How-To Guides" = [
    { "Build an instrument with Assembler" = "how-to/assembler-instrument.md" },
    { "Find and use components" = "how-to/registry-components.md" },
    { "Compile and run" = "how-to/compile-and-run.md" },
  ] },
  { "API Reference" = [
    { "Assembler" = "api/assembler.md" },
    { "Instrument (Instr)" = "api/instr.md" },
    { "Simulation" = "api/simulation.md" },
    { "Registries" = "api/registry.md" },
    { "Expressions" = "api/expression.md" },
    { "Display geometry" = "api/display.md" },
    { "CLI commands" = "api/cli.md" },
  ] },
  { "Examples" = [
    { "HTML Representation" = "examples/html-repr.md" },
    { "Display geometry" = "examples/display_geometry.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "search.highlight",
  "content.code.copy",
  "content.tabs.link",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = true
show_root_heading = true
members_order = "source"
