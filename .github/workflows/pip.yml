name: Pip

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the McCode version whose component and library files are used in tests.
  # Bump this when a new McCode release should be adopted.
  MCCODE_VERSION: v3.5.31

jobs:
  build:
    name: Build with Pip
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        strategy: [".[test,hdf5,mcpl]"]
        exclude:
          # Python-version issues are platform-independent; the full version
          # sweep runs on ubuntu, so Windows/macOS only test oldest + newest.
          - platform: windows-latest
            python-version: "3.11"
          - platform: windows-latest
            python-version: "3.12"
          - platform: windows-latest
            python-version: "3.13"
          - platform: macos-latest
            python-version: "3.11"
          - platform: macos-latest
            python-version: "3.12"
          - platform: macos-latest
            python-version: "3.13"
        include:
          # One bare install to verify the package works without optional extras.
          - platform: ubuntu-latest
            python-version: "3.13"
            strategy: "."

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set min macOS version
      if: runner.os == 'macOS'
      run: |
        echo "MACOS_DEPLOYMENT_TARGET=10.14" >> $GITHUB_ENV

    - name: Setup MSVC compilers for testing
      if: runner.os == 'Windows'
      uses: egor-tensin/vs-shell@v2

    - name: "Build and install strategy = ${{ matrix.strategy }}"
      run: |
        pip install --verbose ${{ matrix.strategy }}
        pip install --verbose pytest

    - name: Locate pooch cache directory
      id: pooch-cache-dir
      shell: python
      run: |
        import os, pooch
        from pathlib import Path
        # All mccode-antlr caches live under a single parent named 'mccodeantlr'
        # inside the OS cache dir (e.g. ~/.cache/mccodeantlr on Linux,
        # %LOCALAPPDATA%\mccodeantlr on Windows).  On Windows, pooch.os_cache()
        # uses the appdirs double-nesting convention so os_cache('mccodeantlr')
        # returns …\mccodeantlr\mccodeantlr\Cache — a *sibling* of the actual
        # registry caches, not their parent.  Walk up from any sub-registry path
        # to find the first path component named 'mccodeantlr'.
        probe = Path(pooch.os_cache('mccodeantlr/libc'))
        parts = probe.parts
        idx = next((i for i, p in enumerate(parts) if p == 'mccodeantlr'), None)
        cache = str(Path(*parts[:idx + 1])) if idx is not None else str(probe.parent)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f'path={cache}\n')

    - name: Cache McCode pooch downloads
      id: cache-pooch
      uses: actions/cache@v6
      with:
        path: ${{ steps.pooch-cache-dir.outputs.path }}
        key: pooch-${{ runner.os }}-${{ env.MCCODE_VERSION }}

    - name: Pre-populate pooch cache
      if: steps.cache-pooch.outputs.cache-hit != 'true'
      run: mccode-antlr cache populate --tag ${{ env.MCCODE_VERSION }}

    - name: Test
      env:
        MCCODEANTLR_MCCODE_POOCH__TAG: ${{ env.MCCODE_VERSION }}
      run: python -m pytest -v -s
