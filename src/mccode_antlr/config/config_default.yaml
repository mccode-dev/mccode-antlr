mcstas:
  name: mcstas
  particle: neutron
  particle_code: 2112
  lib: nlib
  libenv: MCSTAS
  prefix: mc
  project: 1
mcxtrace:
  name: mcxtrace
  particle: xray
  particle_code: 22
  lib: xlib
  libenv: MCXTRACE
  prefix: mx
  project: 2
mccode_pooch:
  source: https://github.com/mccode-dev/McCode
  registry: https://github.com/mccode-dev/mccode-pooch-registries
  tag: latest
  compact_download_messages: false
serialization:
  trust_local_registries: false
  embed_local_files: true
  embed_size_limit_mb: 32
cache:
  # Persist parsed components as `{name}.comp.<build>.json` sidecars beside each
  # .comp file, for later processes to reuse. Saves roughly 0.3 s per translation;
  # worth it for a prebuilt, read-only cache (`mccode-antlr cache build`), e.g.
  # with MCCODEANTLR_CACHE__COMPONENT_IR=true.
  component_ir: false
